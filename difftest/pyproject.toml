[project]
name = "difftest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zeusandatlas", email = "zeusandatlas25@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "zeusandatlas",
]

[project.scripts]
difftest = "difftest:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
zeusandatlas = { url = "https://github.com/zeusandatlasgh/zeusandatlas/releases/download/v0.1/zeusandatlas-0.1.0-cp39-abi3-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
